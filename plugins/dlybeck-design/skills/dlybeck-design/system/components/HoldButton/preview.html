<!doctype html>
<html>
<head><meta charset="utf-8"><title>HoldButton preview</title><style>body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans)}</style></head>
<body>
<div class="dly-grid-paper" style="display:flex;gap:28px;flex-wrap:wrap;align-items:center;justify-content:center;padding:34px 20px">
<button class="dly-btn" id="h1" type="button" style="padding:14px 26px;font-size:1.05rem"><span>Hold to send</span></button>
<button class="dly-btn" id="h2" type="button" style="padding:14px 26px;font-size:1.05rem"><span>Hold to delete draft</span></button>
</div>
<script>Dly.HoldButton(document.getElementById("h1"),{doneLabel:"Sent"});Dly.HoldButton(document.getElementById("h2"),{doneLabel:"Deleted"})</script>
</body>
</html>

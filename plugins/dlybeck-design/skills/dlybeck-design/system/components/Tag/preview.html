<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tag preview</title><style>body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans)}</style></head>
<body>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:20px">
<button class="dly-tag dly-tag--on" type="button" aria-pressed="true">cursive</button>
<button class="dly-tag" type="button" aria-pressed="false">print</button>
<span class="dly-tag dly-tag--blue">3 pages</span>
<span class="dly-tag"><i class="dly-dot" style="background:var(--ok)"></i>Saved</span>
<span class="dly-tag"><i class="dly-dot" style="background:var(--warn)"></i>1 blurry page</span>
<span class="dly-tag"><i class="dly-dot" style="background:var(--bad)"></i>Upload failed</span>
</div>
</body>
</html>
